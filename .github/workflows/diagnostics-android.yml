name: Diagnostics Android

on:
  push:
    paths:
      - "diagnostics/**"
      - ".github/workflows/diagnostics-android.yml"
  pull_request:
    paths:
      - "diagnostics/**"
      - ".github/workflows/diagnostics-android.yml"

concurrency:
  group: diagnostics-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Lint and build diagnostics APK
        run: gradle -p diagnostics lintDebug assembleDebug
