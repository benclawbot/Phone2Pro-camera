name: Validate evidence repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML

      - name: Validate shell syntax
        run: |
          find tools -type f -name '*.sh' -print0 | sort -z | xargs -0 -r -n1 bash -n

      - name: Validate JavaScript syntax
        run: |
          find tools -type f -name '*.js' -print0 | sort -z | xargs -0 -r -n1 node --check

      - name: Validate structured evidence
        run: python tools/ci/validate-repository.py
